<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Group Radar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* =====================================================================
         Group Radar — popup, near-monochrome "Market Terminal" system.
         Toàn bộ chức năng đã chuyển sang dashboard, nên popup rút gọn thành
         một launcher tối giản: chỉ mở bảng quản lý. Vẫn giữ nguyên ngôn ngữ
         thiết kế của dashboard (graphite neutrals + một accent warm-sand).
         ===================================================================== */
      :root {
        color-scheme: dark;

        --bg: oklch(0.155 0 0);
        --surface: oklch(0.19 0 0);
        --surface-2: oklch(0.225 0 0);
        --ink: oklch(0.96 0 0);
        --ink-soft: oklch(0.765 0 0);
        --ink-faint: oklch(0.6 0 0);
        --line: oklch(0.3 0 0);
        --line-soft: oklch(0.255 0 0);

        --accent: oklch(0.745 0.045 80);
        --accent-bright: oklch(0.8 0.05 82);
        --accent-ink: oklch(0.8 0.04 82);
        --on-accent: oklch(0.2 0.012 80);
        --accent-ring: oklch(0.745 0.045 80 / 0.4);

        --r-sm: 6px;
        --r-md: 9px;

        --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
        --t-fast: 0.12s;
        --t-mid: 0.18s;

        --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "Noto Sans", sans-serif;
        --font-display: "Space Grotesk", var(--font);
      }

      * { box-sizing: border-box; }

      body {
        width: 300px;
        margin: 0;
        font-family: var(--font);
        background: var(--bg);
        color: var(--ink);
        font-size: 13px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }

      ::selection { background: oklch(0.285 0.014 80); color: var(--ink); }

      /* ---- Brand header with amber signal rail ---- */
      header {
        position: relative;
        display: flex;
        align-items: center;
        gap: 11px;
        background: var(--surface);
        padding: 16px;
        border-bottom: 1px solid var(--line);
      }
      header::before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--accent);
      }
      .logo {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        flex: none;
        border-radius: var(--r-md);
        background: var(--surface-2);
        border: 1px solid var(--line);
        color: var(--accent-ink);
      }
      .logo svg { width: 18px; height: 18px; }
      .brand h1 {
        font-family: var(--font-display);
        font-size: 15px;
        margin: 0;
        font-weight: 600;
        letter-spacing: -0.015em;
      }
      .brand p {
        margin: 2px 0 0;
        font-size: 11px;
        color: var(--ink-soft);
      }

      /* ---- Body ---- */
      .body { padding: 16px; }
      .lede {
        margin: 0 0 14px;
        font-size: 12px;
        color: var(--ink-soft);
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        padding: 12px 14px;
        border: 1px solid transparent;
        border-radius: var(--r-sm);
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        background: var(--accent);
        color: var(--on-accent);
        transition: background var(--t-fast), transform var(--t-fast) var(--ease-out);
      }
      .btn-primary:hover { background: var(--accent-bright); }
      .btn-primary:active { transform: translateY(1px); }
      .btn-primary:focus-visible {
        outline: none;
        box-shadow: 0 0 0 3px var(--accent-ring);
      }
      .btn-primary svg { width: 16px; height: 16px; }

      .hint {
        margin: 12px 0 0;
        font-size: 11px;
        color: var(--ink-faint);
        text-align: center;
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9" />
          <circle cx="12" cy="12" r="4.5" />
          <circle cx="12" cy="12" r="1" fill="currentColor" />
        </svg>
      </div>
      <div class="brand">
        <h1>Group Radar</h1>
        <p>Trung tâm quản lý</p>
      </div>
    </header>

    <div class="body">
      <p class="lede">
        Toàn bộ tính năng — nhóm, crawl, bài viết, đăng &amp; bình luận tự động —
        đều nằm trong bảng quản lý.
      </p>
      <button id="btnDashboard" class="btn-primary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="9" rx="1" />
          <rect x="14" y="3" width="7" height="5" rx="1" />
          <rect x="14" y="12" width="7" height="9" rx="1" />
          <rect x="3" y="16" width="7" height="5" rx="1" />
        </svg>
        Mở bảng quản lý
      </button>
      <p class="hint">Mở trong tab mới hoặc chuyển tới tab đang mở.</p>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
